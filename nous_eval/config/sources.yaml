# F051 source registry — points all qrels at $NOUS_EVAL_FIXTURES_DIR/qrels_*.jsonl.
# The expected fixtures-dir layout is the version subdir of the nous-eval-fixtures
# repo (e.g. NOUS_EVAL_FIXTURES_DIR=/path/to/nous-eval-fixtures/v2026-Q2).
#
# Probes lives alongside the other qrels in the same version subdir for v2026-Q2+,
# replacing the earlier "tests/fixtures/eval_probes.jsonl" public-repo path which
# was the smoke fallback when no fixtures dir was set.
sources:
  - name: longmemeval
    path: "${NOUS_EVAL_FIXTURES_DIR}/qrels_longmemeval.jsonl"
    enabled_by_default: true
    gate_eligible: true
    requires_fixtures_dir: true
    description: "Stratified 20-Q LongMemEval_S subset"

  - name: ai_hand_labeled
    path: "${NOUS_EVAL_FIXTURES_DIR}/qrels_hand_labels.jsonl"
    enabled_by_default: true
    gate_eligible: false
    requires_fixtures_dir: true
    review_filter: "reviewed_by != null"
    description: "AI-drafted hand-labeled qrels (reviewed_by gates eligibility)"

  - name: probes
    path: "${NOUS_EVAL_FIXTURES_DIR}/qrels_probes.jsonl"
    enabled_by_default: true
    gate_eligible: true
    requires_fixtures_dir: true
    description: "Auto-generated deterministic probes ('What does F<NN> ship?')"

  - name: silver_episodes
    path: "${NOUS_EVAL_FIXTURES_DIR}/qrels_silver.jsonl"
    enabled_by_default: true
    gate_eligible: false
    requires_fixtures_dir: true
    description: "Click-model-style silver labels mined from heart.episodes"

  - name: synthetic_haiku
    path: "${NOUS_EVAL_FIXTURES_DIR}/qrels_synthetic.jsonl"
    enabled_by_default: false
    gate_eligible: false
    requires_fixtures_dir: true
    description: "Haiku-reverse-generated (informational only, circular risk)"

  - name: graph_targeted
    path: "${NOUS_EVAL_FIXTURES_DIR}/qrels_graph_targeted.jsonl"
    # Default-off until the eval corpus contains an inferred-edge
    # population that gives the F065 penalty multiplier something to
    # apply to. On the v2026-Q2 nous-prod-snapshot corpus (and on the
    # current prod nous DB, verified 2026-05-23) the
    # extraction_method='inferred' bucket is empty, so the strict-
    # top-K validator yields zero qrels and shipping the source as
    # enabled-by-default would inject an empty gate-eligible source
    # into every run.
    enabled_by_default: false
    gate_eligible: false
    requires_fixtures_dir: true
    description: "Graph-only-reachable queries — opt-in via --sources graph_targeted once the corpus has inferred-tier edges (see nous_eval.generate_graph_qrels)"

  - name: graph_bridge_ungated
    path: "${NOUS_EVAL_FIXTURES_DIR}/qrels_graph_nogate.jsonl"
    # Same generator as graph_targeted with the reachability gate OFF.
    #
    # WHY the gate is skipped, measured 2026-08-24 on a prod clone (n=57 from 60
    # edges, scripts/diag/qrel_generator_baseline.py): NOT generator bias. The
    # generator's ceiling is 64.9% — ample. The gate yields nothing because its
    # two halves are identical: graph-OFF finds the target in top-10 for 20/57
    # and graph-ON finds it for the SAME 20/57, so 0 rows pass. Graph expansion
    # changed top-10 membership in zero cases.
    #
    # (An earlier revision of this comment blamed a ~5% ceiling from 94.8%
    # raw-vector top-50 findability. That was wrong by ~11x — the gate runs the
    # pipeline at top-10, not raw vector at top-50 — and it attributed the empty
    # source to the wrong half of the gate.)
    #
    # These rows are usable for PAIRED A/B — ties cost n, not correctness — and
    # are NOT evidence that graph expansion reached anything.
    # gate_eligible stays false: gold here are decision-targets of inferred
    # edges, i.e. favourable ground for the graph mechanisms under test.
    enabled_by_default: false
    gate_eligible: false
    requires_fixtures_dir: true
    description: "Graph-bridge queries, UNVALIDATED reachability — paired-A/B only, never graph-only evidence (see nous_eval.generate_graph_qrels --no-reachability-gate)"

  - name: nous_prod
    path: "tests/fixtures/qrels_nous_prod.jsonl"
    enabled_by_default: false
    gate_eligible: false
    requires_fixtures_dir: false
    description: "Haiku-generated qrels from prod Nous snapshot (agent_id=nous-prod-snapshot, opt-in via --sources nous_prod)"

  - name: nous_prod_procedures
    path: "tests/fixtures/qrels_nous_prod_procedures.jsonl"
    enabled_by_default: false
    gate_eligible: false
    requires_fixtures_dir: false
    description: "Haiku-generated task-shaped queries against heart.procedures from prod snapshot (procedural memory eval)"
