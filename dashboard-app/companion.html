<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dashboard/v2/favicon.svg" />
    <!-- use-credentials is LOAD-BEARING behind oauth2-proxy: browsers fetch
         the manifest WITHOUT cookies by default, so the proxy answered 401,
         Chrome concluded there is no valid manifest, and Add-to-Home-Screen
         silently degraded to a browser-tab bookmark (prod diagnosis
         2026-09-01). With use-credentials the fetch carries the session
         cookie of the already-authenticated user. Icons are still fetched
         uncredentialed by the browser process — those need a proxy
         skip-auth rule (see F092.2 deploy notes). -->
    <link rel="manifest" href="/dashboard/v2/companion.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="180x180" href="/dashboard/v2/icons/apple-touch-icon.png" />
    <!-- Without apple-mobile-web-app-capable, iOS/iPadOS "Add to Home Screen"
         creates a BOOKMARK that opens in a Safari tab — the manifest's
         display:standalone alone is not honoured there. The generic
         mobile-web-app-capable is the successor spelling Chromium reads. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nous" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The paper default (PR 6): a light page under the Atlantic-blue bar.
         Android paints its status bar in theme-color; iOS ignores it and the
         page draws under the black-translucent status bar, whose white text
         sits on the bar's navy. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#12304f" />
    <title>Nous Companion</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/companion/companion.ts"></script>
  </body>
</html>
