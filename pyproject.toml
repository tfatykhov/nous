[project]
name = "nous"
version = "0.1.0"
description = "A cognitive agent framework built on Society of Mind principles"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.3,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "cel-python>=0.4,<1.0",
    "croniter>=6.0.0",
    "h2>=4.3.0",
    "anthropic>=0.52,<1.0",
]

[project.optional-dependencies]
runtime = [
    "uvicorn>=0.30,<1.0",
    "starlette>=0.40,<1.0",
    "mcp>=1.0,<2.0",
]
agent = [
    "pandas>=2.0,<3.0",
    "matplotlib>=3.8,<4.0",
    "tabulate>=0.9,<1.0",
    "python-docx>=1.0,<2.0",
    "python-pptx>=1.0,<2.0",
    "openpyxl>=3.1,<4.0",
    "Pillow>=10.0,<13.0",
    "beautifulsoup4>=4.12,<5.0",
    "pytest>=8.0",
    "graphviz>=0.20,<1.0",
    "aiohttp>=3.9,<4.0",
    "xlrd>=2.0,<3.0",
    "google-api-python-client>=2.0,<3.0",
    "google-auth>=2.0,<3.0",
]
dev = [
    "starlette>=0.40,<1.0",
    "httpx>=0.25,<1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["nous*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
