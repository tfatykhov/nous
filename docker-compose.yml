services:
  nous:
    build: .
    container_name: nous-agent
    ports:
      - "${NOUS_PORT:-8000}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=nous
      - DB_PASSWORD=${DB_PASSWORD:-nous_dev_password}
      - DB_NAME=nous
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NOUS_AGENT_ID=${NOUS_AGENT_ID:-nous-default}
      - NOUS_AGENT_NAME=${NOUS_AGENT_NAME:-Nous}
      - NOUS_MODEL=${NOUS_MODEL:-claude-sonnet-4-5-20250514}
      - NOUS_LOG_LEVEL=${NOUS_LOG_LEVEL:-info}
      - NOUS_MCP_ENABLED=${NOUS_MCP_ENABLED:-true}
      - NOUS_MAX_TURNS=${NOUS_MAX_TURNS:-10}
      - NOUS_THINKING_MODE=${NOUS_THINKING_MODE:-off}
      - NOUS_THINKING_BUDGET=${NOUS_THINKING_BUDGET:-10000}
      - NOUS_EFFORT=${NOUS_EFFORT:-high}
      - NOUS_WORKSPACE_DIR=${NOUS_WORKSPACE_DIR:-/tmp/nous-workspace}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - NOUS_EVENT_BUS_ENABLED=${NOUS_EVENT_BUS_ENABLED:-true}
      - NOUS_EPISODE_SUMMARY_ENABLED=${NOUS_EPISODE_SUMMARY_ENABLED:-true}
      - NOUS_FACT_EXTRACTION_ENABLED=${NOUS_FACT_EXTRACTION_ENABLED:-true}
      - NOUS_SLEEP_ENABLED=${NOUS_SLEEP_ENABLED:-true}
      - NOUS_BACKGROUND_MODEL=${NOUS_BACKGROUND_MODEL:-claude-sonnet-4-5-20250514}
      - NOUS_SESSION_TIMEOUT=${NOUS_SESSION_TIMEOUT:-1800}
      - NOUS_SLEEP_TIMEOUT=${NOUS_SLEEP_TIMEOUT:-7200}
      - NOUS_SLEEP_CHECK_INTERVAL=${NOUS_SLEEP_CHECK_INTERVAL:-60}
      - NOUS_IDENTITY_PROMPT=${NOUS_IDENTITY_PROMPT:-}
      # Subtasks & Scheduling
      - NOUS_SUBTASK_ENABLED=${NOUS_SUBTASK_ENABLED:-true}
      - NOUS_SUBTASK_WORKERS=${NOUS_SUBTASK_WORKERS:-2}
      - NOUS_SUBTASK_POLL_INTERVAL=${NOUS_SUBTASK_POLL_INTERVAL:-2}
      - NOUS_SUBTASK_DEFAULT_TIMEOUT=${NOUS_SUBTASK_DEFAULT_TIMEOUT:-120}
      - NOUS_SUBTASK_MAX_TIMEOUT=${NOUS_SUBTASK_MAX_TIMEOUT:-600}
      - NOUS_SUBTASK_MAX_CONCURRENT=${NOUS_SUBTASK_MAX_CONCURRENT:-3}
      - NOUS_SCHEDULE_ENABLED=${NOUS_SCHEDULE_ENABLED:-true}
      - NOUS_SCHEDULE_CHECK_INTERVAL=${NOUS_SCHEDULE_CHECK_INTERVAL:-60}
      - NOUS_TELEGRAM_BOT_TOKEN=${NOUS_TELEGRAM_BOT_TOKEN:-}
      - NOUS_TELEGRAM_CHAT_ID=${NOUS_TELEGRAM_CHAT_ID:-}
      # Google Drive (service account)
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_SERVICE_ACCOUNT_PATH=${GOOGLE_SERVICE_ACCOUNT_PATH:-}
      # Google Drive OAuth (preferred for uploads)
      - GDRIVE_CLIENT_ID=${GDRIVE_CLIENT_ID:-}
      - GDRIVE_CLIENT_SECRET=${GDRIVE_CLIENT_SECRET:-}
      - GDRIVE_REFRESH_TOKEN=${GDRIVE_REFRESH_TOKEN:-}
      # Context Quality (F016/F017)
      - NOUS_CONTEXT_WINDOW=${NOUS_CONTEXT_WINDOW:-0}
      - NOUS_ANTI_HALLUCINATION_PROMPT=${NOUS_ANTI_HALLUCINATION_PROMPT:-true}
      - NOUS_TOOL_PRUNING_ENABLED=${NOUS_TOOL_PRUNING_ENABLED:-true}
      - NOUS_TOOL_SOFT_TRIM_CHARS=${NOUS_TOOL_SOFT_TRIM_CHARS:-4000}
      - NOUS_TOOL_SOFT_TRIM_HEAD=${NOUS_TOOL_SOFT_TRIM_HEAD:-1500}
      - NOUS_TOOL_SOFT_TRIM_TAIL=${NOUS_TOOL_SOFT_TRIM_TAIL:-1500}
      - NOUS_TOOL_METADATA_DEGRADE_AFTER=${NOUS_TOOL_METADATA_DEGRADE_AFTER:-8}
      - NOUS_TOOL_HARD_CLEAR_AFTER=${NOUS_TOOL_HARD_CLEAR_AFTER:-12}
      - NOUS_KEEP_LAST_TOOL_RESULTS=${NOUS_KEEP_LAST_TOOL_RESULTS:-2}
      - NOUS_COMPACTION_ENABLED=${NOUS_COMPACTION_ENABLED:-true}
      - NOUS_RELEVANCE_FLOOR_ENABLED=${NOUS_RELEVANCE_FLOOR_ENABLED:-true}
      - NOUS_RELEVANCE_DROP_RATIO=${NOUS_RELEVANCE_DROP_RATIO:-0.6}
      - NOUS_BUDGET_SCALE_ENABLED=${NOUS_BUDGET_SCALE_ENABLED:-true}
      - NOUS_CONTEXT_BUDGET_OVERRIDES=${NOUS_CONTEXT_BUDGET_OVERRIDES:-}
      - NOUS_STALENESS_PENALTY_ENABLED=${NOUS_STALENESS_PENALTY_ENABLED:-true}
      - NOUS_STALENESS_HALF_LIFE_DAYS=${NOUS_STALENESS_HALF_LIFE_DAYS:-14}
      - NOUS_TOOL_TIMEOUT=${NOUS_TOOL_TIMEOUT:-120}
      - NOUS_KEEPALIVE_INTERVAL=${NOUS_KEEPALIVE_INTERVAL:-10}
      # F042: Cross-encoder reranking
      - NOUS_CROSS_ENCODER_ENABLED=${NOUS_CROSS_ENCODER_ENABLED:-false}
      - NOUS_CROSS_ENCODER_MODEL=${NOUS_CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - NOUS_CROSS_ENCODER_MAX_CANDIDATES=${NOUS_CROSS_ENCODER_MAX_CANDIDATES:-30}
      - NOUS_CROSS_ENCODER_TEXT_LIMIT=${NOUS_CROSS_ENCODER_TEXT_LIMIT:-512}
      # HuggingFace cache dir — pinned so the volume mount below matches
      - HF_HOME=/root/.cache/huggingface
    volumes:
      # F042: persist downloaded cross-encoder models across container restarts
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  telegram:
    build: .
    container_name: nous-telegram
    command: python -m nous.telegram_bot
    healthcheck:
      disable: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOUS_API_URL: http://nous:8000
      NOUS_ALLOWED_USERS: ${NOUS_ALLOWED_USERS:-}
    depends_on:
      - nous
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: nous-postgres
    environment:
      POSTGRES_DB: nous
      POSTGRES_USER: nous
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nous_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql
      - ./sql/migrations/010_subtasks.sql:/docker-entrypoint-initdb.d/003-subtasks.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nous"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  huggingface_cache:
